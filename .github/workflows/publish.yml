name: Publish

# Rebuilds the F-Droid repo at apps.nextcolor.org from the GitHub Releases of
# every app listed in fdroid/metadata. Runs once a day and after a change
# here, and only builds when something it is built from changed since the
# live version (see scripts/inputs.py). A run by hand from the Actions tab
# always builds.
on:
  schedule:
    - cron: "17 5 * * *"
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read
  # Lets gh read the apps' attestations
  attestations: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      inputs: ${{ steps.inputs.outputs.hash }}
      build: ${{ steps.compare.outputs.build }}
    steps:
      - uses: actions/checkout@v7

      - name: Hash what the repo is built from
        id: inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          hash=$(scripts/inputs.py)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # Asks GitHub where the site is live, so this works before the custom
      # domain is set up too.
      - name: Compare with the live site
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          HASH: ${{ steps.inputs.outputs.hash }}
        run: |
          site=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          live=""
          if [ -n "$site" ]; then
            live=$(curl -fsSL "${site%/}/build-inputs.txt" || true)
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "Run by hand, building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$live" = "$HASH" ]; then
            echo "::notice::Nothing changed since the live version. Skipped the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Live version is ${live:-missing}, new one is $HASH. Building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # The custom domain set in Settings > Pages. People save this address in
      # F-Droid when they add the repo, so it should never change.
      SITE_URL: https://apps.nextcolor.org
    steps:
      - uses: actions/checkout@v7

      - name: Unpack repo key
        env:
          KEYSTORE_BASE64: ${{ secrets.REPO_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The REPO_KEYSTORE_BASE64 secret is missing. See SETUP.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > fdroid/keystore.p12

      - name: Fetch APKs, check attestations, and fetch store listings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/collect.py

      - name: Install fdroidserver
        run: pipx install --include-deps fdroidserver==2.4.5

      - name: Build F-Droid repo
        working-directory: fdroid
        env:
          KEYSTORE_PASSWORD: ${{ secrets.REPO_KEYSTORE_PASSWORD }}
        run: |
          cat > config.yml <<EOF
          repo_url: $SITE_URL/fdroid/repo
          repo_name: NextColor Apps
          repo_description: Apps published by NextColor. Each app page names its author.
          repo_icon: icon.png
          archive_older: 0
          repo_keyalias: repo
          keystore: keystore.p12
          keystorepass: $KEYSTORE_PASSWORD
          keypass: $KEYSTORE_PASSWORD
          EOF
          chmod 600 config.yml

          fdroid update --use-date-from-apk

          fingerprint=$(keytool -list -v -keystore keystore.p12 -storepass "$KEYSTORE_PASSWORD" -alias repo \
            | sed -n 's/^.*SHA256: //p' | tr -d ':')
          ../scripts/site.py "$SITE_URL" "$fingerprint"
          qr --factory=svg-path "$SITE_URL/fdroid/repo?fingerprint=$fingerprint" > ../out/repo-qr.svg
          rm keystore.p12 config.yml

      # The next run compares against this to tell whether anything changed.
      - name: Save the hash of what this was built from
        env:
          HASH: ${{ needs.check.outputs.inputs }}
        run: echo "$HASH" > out/build-inputs.txt

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      - id: deploy
        uses: actions/deploy-pages@v5
